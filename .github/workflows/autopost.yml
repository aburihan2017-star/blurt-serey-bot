name: Blurt to Serey Auto Post

on:
  schedule:
    # বাংলাদেশ সময় সকাল ১০:০০ এবং রাত ১০:০০ টায় রান হবে (UTC 04:00 & 16:00)
    - cron: '0 4,16 * * *'
  workflow_dispatch:

# গিটহাবে পুশ করার পারমিশন নিশ্চিত করা হলো
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beem

      - name: Run Auto Poster
        env:
          SEREY_POSTING_KEY: ${{ secrets.SEREY_POSTING_KEY }}
          SEREY_USERNAME: raihan123
        run: python main.py

      - name: Save Queue and Log State
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@github.com"
          git add automation_data.json || true
          git commit -m "Update post queue and history [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
