name: Blurt to Serey Auto Post

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm init -y
          npm install axios sereyjs

      - name: Run Auto Poster
        env:
          SEREY_USERNAME: ${{ secrets.SEREY_USERNAME }}
          SEREY_POSTING_KEY: ${{ secrets.SEREY_POSTING_KEY }}
        run: node index.js

      - name: Save Queue and Log State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add automation_data.json
          git commit -m "Update automation data [skip ci]" || echo "No changes to commit"
          git push
